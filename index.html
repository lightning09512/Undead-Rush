<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="Undead Rush is a top-down zombie action game. Fight through escalating waves, collect score shards, face rotating bosses, and survive as long as you can." />
  <link rel="icon" type="image/jpeg" href="./icon.jpg" />
  <title>Undead Rush</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: auto;
    }
    @font-face {
      font-family: 'GameFont';
      src: local('Segoe UI'), local('Arial'), local('Helvetica');
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
